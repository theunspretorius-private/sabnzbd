services:
  sabnzbd:
    # Replace <owner>/<repo> with your lowercase GitHub username and repository name
    image: ghcr.io/<owner>/<repo>:latest
    container_name: sabnzbd
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
      - UMASK=002
      # Optional: comma-separated NAS hostnames allowed to access the web UI
      # - HOST_WHITELIST=nas,nas.local
    ports:
      - "8080:8080"
    volumes:
      - ./config:/config
      - ./downloads:/downloads
      - ./incomplete-downloads:/incomplete-downloads

