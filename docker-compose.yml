services:
  sabnzb:
    image: ghcr.io/theunspretorius-private/sabnzbd:latest
    container_name: sabnzb
    restart: unless-stopped
    working_dir: /skobbejak
    networks:
      - media
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Johannesburg
    ports:
      - "8080:8080"
    volumes:
      - /volume1/Multimedia/config/sabnzb:/config
      - /volume1/Multimedia:/skobbejak

networks:
  media:
    external: true
